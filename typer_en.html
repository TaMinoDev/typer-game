<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typer</title>
    <style>
        html {
            background-color: grey;
            padding: 5vw;
            display: flex;
            align-items: baseline;
            justify-content: center;
            background: linear-gradient(var(--gradient-angle), red, orange);
            height: 100vh;
            animation: infinite forwards 120s bg;
            transition: 5s;
        }

        body {
            align-items: baseline;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: x-large;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            background-color: rgba(255, 255, 255, 0.25);
            scroll-behavior: smooth;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .mistakes {
            color: white;
            background-color: rgba(255, 174, 0, 0.75);
            border: 1px solid black;
            border-radius: 10px;
            padding: 5px;
        }

        .main {
            display: block;
        }

        #feedback, #textDiv {
            font-size: medium;
            user-select: none;
            -webkit-user-select: none;
        }

        mark {
            background-color: white;
        }

        @property --gradient-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes bg {
            0% {
                --gradient-angle: 0deg;
            }
            100% {
                --gradient-angle: 360deg;
            }
        }

        button, select, select option, input, select:focus, textarea {
            border: none;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            background-color: rgba(255, 255, 255, 0.5);
            padding: 5px;
            border-radius: 5px;
            outline: none
        }

        select option {
            appearance: base-select;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="textDiv"></div>
        <span id="feedback"></span>
    </div>
    <div class="start">
        <h1>Typer<br>Typing with speed<small><sup>V 1.5</sup></small></h1>
        <h3>Mesure and train your typingspeed!</h3>
        <button onclick="setUp()">Start</button>
        <select>
            <option>Lose Words</option>
            <option>Whole Sentenses</option>
            <option>Lose words from real sentenses</option>
            <option>Random Symbols</option>
            <option>Write from your own Text</option>
        </select>
        <input id="goaler" type="number" min="1" value="5" placeholder="Anzahl">
        <button onclick="freeStyle()">Free Style</button>
        <br>
        <hr>
        <textarea id="textInput"></textarea>
    </div>
    <script src="list/many_words_en.js"></script>
    <script>
        const textDiv = document.getElementById('textDiv');
        const feedbackSpan = document.getElementById('feedback');
        const textInput = document.getElementById('textInput');

        let text = '';
        let index = 0;
        let contin = true;
        let goal = 5;
        let setted = false;
        let mode = '';
        let txtIndex = 0;
        let score = {
            right: 0,
            wrong: 0,
            trys: 0,
            done: 0,
            time: 0, // ms
            errors: [],
        }

        const keys = ['Home','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Clear','End','PageDown','Insert','Delete','Shift','Control','Tab','Backspace','Enter','ContextMenu','AltGraph','Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','Pause','PageUp','CapsLock','Entf','Alt'];
        const groups = {
            "Lose Words": words,
            "Lose words from real sentenses": 'To be an developer is very interesting and nearly always fun you can work alone or in a big team with many rols such as designers or writers'.split(' '),
            "Whole Sentenses": 'To write a text can be much fun.,If your text is not special or historycal important less people will read it.,Writing a text in the english language is spical because you have to translate it in your head if your are not nativ english speaker.,Ameria or the United States of Ameria are realy big when you compare it to countrys like germany or sweden.,Most of the world population is living in asia mostly india and china.,To think of something new that now one has done befor will be more difficult the longer you wait.,Sience is much fun because you can let things explode without hurting someone.'.split(','),
            "Random Symbols": 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890.-,'.split(''),
            "Write from your own Text": ""
        };
        let possible = [];

        window.onload = () => {
            if(localStorage.getItem('typer-text')) {
                textInput.value = localStorage.getItem('typer-text');
            }
        }

        function setUp() {
            score = {
                right: 0,
                wrong: 0,
                trys: 0,
                done: 0,
                time: 0,
                errors: [],
            };
            setted = true;
            contin = true;

            mode = document.querySelector('select') ? document.querySelector('select').value : mode;
            goal = document.getElementById('goaler') ? Number(document.getElementById('goaler').value) : goal;

            if(mode === 'Text abschreiben') {
                possible = document.getElementById('textInput').value.split(/[\.,\n ]/);
                localStorage.setItem('typer-text',document.getElementById('textInput').value);
                txtIndex = 0;
                goal = possible.length;
            } else {
                possible = groups[mode];
            }

            feedbackSpan.innerHTML = '';
            textDiv.innerHTML  = '';

            load();
            document.querySelector('div.start')?.remove();
        }

        function freeStyle() {
            score = {
                right: 0,
                wrong: 0,
                trys: 0,
                done: 0,
                time: 0,
                errors: [],
            };
            setted = true;
            mode = document.querySelector('select') ? document.querySelector('select').value : mode;
            goal = NaN;
            if(mode === 'Write from your own Text') {
                possible = groups["Lose Words"];
            } else {
                possible = groups[mode];
            }
               
            load();
            document.querySelector('div.start').remove();
        }

        function load() {
            index = 0;
            if(mode === 'Random Symbols') {
                text = possible = getSymbols();
                console.log(text)
            } else if(mode === 'Write from your own Text') {
                text = possible[txtIndex];
                txtIndex++;
            } else {
                text = possible[random(0,possible.length-1)];
            }
            draw();
        }

        function getSymbols() {
            const text = 'abcdefghijklmnopqrstuvwxyzäöüABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'.split('');
            const länge = random(5,15);
            let result = '';
            for(let l = 0; l <= länge; l++) {
                result += text[random(0,text.length-1)];
            }
            return result;
        }
        
        document.addEventListener('keydown', function (e) {
            if(setted === true) {
                if(score.done === 0 && keys.includes(e.key) === false) {
                    count();
                }
                if(e.key === ' ') {
                    e.preventDefault();
                }
                if(e.key === text.split('')[index]) {
                    console.log('right');
                    console.log(e.key);
                    index++;
                    draw();
                    score.right++;
                    score.trys++;
                } else if(keys.includes(e.key) === false) {
                    console.log('wrong');
                    score.wrong++;
                    score.errors.push(`"${e.key}" pressed, but "${text.split('')[index]}" from "${text}" was required.`);
                    score.trys++;
                }
                if(e.key === 'Tab') {
                    showEnd();
                } else if(e.key === 'Escape') {
                    location.reload();
                }
            }
        });

        function draw() {
            let done = text.split('').slice(0,index);
            let working = text.split('').slice(index,index+1);
            let todo = text.split('').slice(index+1,text.split('').length);

            textDiv.innerHTML = `<span class="done">${done.join('')}</span><mark>${working.join('')}</mark><b>${todo.join('')}</b>`;

            console.log({
                'done': done,
                'working': working,
                'todo': todo
            });

            if(working.length === 0) {
                console.log('Fertig');
                score.done++;
                if(score.done !== goal) {
                    load();
                } else {
                    showEnd();
                }
            }
        }

        function random(min, max) {
            min = Math.ceil(min);
            max = Math.floor(max);
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function count() {
            if(contin === true) {
                score.time += 50;
                setTimeout(count,50);
                feedbackSpan.innerText = (score.time/1000).toFixed(2);
            }
        }

        function showEnd() {
            contin = false;
            textDiv.innerHTML = '';
            feedbackSpan.innerHTML = `
            <b>
            <span>Time (s): ${(score.time/1000).toFixed(2)}</span>
            <br>
            <span>Rigth: ${score.right}/${score.trys}, Wrong: ${score.wrong}/${score.trys}</span>
            <br>
            <span>Reached: ${score.done}/${goal}</span>
            <br>
            <span title="Symbols per Second">SpS: ${(score.right/(score.time/1000)).toFixed(2)}/s</span>
            <br>
            </b>
            <progress style="accent-color: lime;" max="100" value="${(score.right/score.trys)*100}"></progress>
            <details class="mistakes" title="All Mistakes listed">
                <summary>All Mistakes</summary>
            ${score.errors.join('<br><br>')}    
            </details>
            <br>
            <button onclick="location.reload()">Again?</button>
            `
        }
    </script>
</body>
</html>
