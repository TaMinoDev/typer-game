<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typer - LANG</title>
    <style>
        html {
            background-color: grey;
            padding: 5vw;
            display: flex;
            align-items: baseline;
            justify-content: center;
            background: linear-gradient(var(--gradient-angle), red, rgb(0, 255, 242));
            height: 100vh;
            animation: infinite forwards 120s bg;
            transition: 5s;
        }

        body {
            align-items: baseline;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: x-large;
            border-radius: 10px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.25);
            scroll-behavior: smooth;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        @property --gradient-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes bg {
            0% {
                --gradient-angle: 0deg;
            }

            100% {
                --gradient-angle: 360deg;
            }
        }

        button,
        select,
        select option,
        input,
        select:focus,
        textarea {
            border: none;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            background-color: rgba(255, 255, 255, 0.5);
            padding: 5px;
            border-radius: 5px;
            outline: none
        }
    </style>
</head>
<body>
    <button onclick="location.href = './typer_de.html'">German - Deutsch</button>
    <br>
    <button onclick="location.href = './typer_en.html'">English - English</button>
    <br>
    <small>More Languages comming soon!</small>
    <br>
    <small><sub>Planed: French, Spanish</sub></small>
</body>
</html>
